name: "🌙 Cloud — Down (delete GPU box)"

# Manual button in the Actions tab. Deletes the server + boot volume + public
# IP so compute billing stops. KEEPS the persistent data volume (models/DB)
# unless you set wipe_volume=true.
on:
  workflow_dispatch:
    inputs:
      wipe_volume:
        description: "Also DELETE the persistent data volume (models/DB). Use to fully reset."
        type: boolean
        required: false
        default: false

concurrency:
  group: meetingmind-cloud-lifecycle   # never run up/down at the same time
  cancel-in-progress: false

jobs:
  down:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Scaleway CLI + jq
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq jq
          gh release download --repo scaleway/scaleway-cli --pattern '*_linux_amd64' --output ./scw --clobber
          sudo install -m 0755 ./scw /usr/local/bin/scw
          scw version

      - name: Tear the stack down
        env:
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
          SCW_DEFAULT_ORGANIZATION_ID: ${{ secrets.SCW_DEFAULT_ORGANIZATION_ID }}
          MM_WIPE_VOLUME: ${{ github.event.inputs.wipe_volume }}
        run: bash deploy/scaleway/cloud.sh down

      - name: Summary
        if: always()
        run: |
          echo "### MeetingMind cloud" >> $GITHUB_STEP_SUMMARY
          echo "🌙 Server deleted — **compute billing stopped**." >> $GITHUB_STEP_SUMMARY
          echo "Persistent data volume kept (small storage cost)." >> $GITHUB_STEP_SUMMARY
