services:
  postgres:
    image: postgres:15
    container_name: meetingmind_postgres
    shm_size: '2gb'
    oom_score_adj: -500
    environment:
      POSTGRES_DB: meetingmind
      POSTGRES_USER: meetingmind
      POSTGRES_PASSWORD: meetingmind
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - meetingmind_network

  redis:
    image: redis:7
    container_name: meetingmind_redis
    ports:
      - "6379:6379"
    networks:
      - meetingmind_network

  qdrant:
    image: qdrant/qdrant:latest
    container_name: meetingmind_qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - meetingmind_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: meetingmind_backend
    depends_on:
      - postgres
      - redis
      - qdrant
    volumes:
      - hf_cache:/home/appuser/.cache
    environment:
      DATABASE_URL: postgresql://meetingmind:meetingmind@postgres:5432/meetingmind
      REDIS_URL: redis://redis:6379/0
      VEXA_API_URL: http://gateway:8000/bots
      VEXA_WS_URL: ws://gateway:8000/ws
      VEXA_API_KEY: ${VEXA_API_KEY}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434/api/generate}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-hermes3:8b}
      OLLAMA_FINAL_MODEL: ${OLLAMA_FINAL_MODEL:-hermes3:8b}
      OLLAMA_TIMEOUT_SECONDS: "${OLLAMA_TIMEOUT_SECONDS:-120}"
      MEM0_ENABLED: "true"
      MEM0_SEARCH_ENABLED: "true"
      MEM0_SAVE_ENABLED: "true"
      MEM0_OLLAMA_URL: ${MEM0_OLLAMA_URL:-http://ollama:11434}
      MEM0_LLM_MODEL: ${MEM0_LLM_MODEL:-hermes3:8b}
      MEM0_EMBED_MODEL: ${MEM0_EMBED_MODEL:-nomic-embed-text}
      MEM0_QDRANT_URL: ${MEM0_QDRANT_URL:-http://qdrant:6333}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-MeetingMind <onboarding@resend.dev>}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    networks:
      - meetingmind_network
      - vexa_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: meetingmind_frontend
    ports:
      - "3000:80"
      - "443:443"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    networks:
      - meetingmind_network

  ollama:
    image: ollama/ollama:latest
    container_name: meetingmind_ollama
    environment:
      OLLAMA_NUM_PARALLEL: "2"
      OLLAMA_KV_CACHE_TYPE: "q8_0"
      OLLAMA_MAX_VRAM: "16384"
      OLLAMA_KEEP_ALIVE: "10h"
    shm_size: '2gb'
    # Commented out port binding when using native Ollama on host port 11434
    # ports:
    #   - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - meetingmind_network
    # CPU/memory limits prevent Ollama from starving Whisper transcription.
    # On Apple Silicon (Docker CPU-only, no Metal GPU), Ollama consumes ALL
    # available cores without limits. Adjust cpus based on your core count:
    #   M4 Pro (14 cores): cpus=8 leaves 6 for Whisper + services
    #   M3/M2 Pro (12 cores): cpus=6 leaves 6 for Whisper + services
    #   M1/M2 (8 cores): cpus=4 leaves 4 for Whisper + services
    # For Linux NVIDIA GPU: remove the limits block and uncomment the GPU
    # reservations below instead.
    deploy:
      resources:
        limits:
          cpus: "${OLLAMA_CPU_LIMIT:-8.0}"
          memory: "${OLLAMA_MEMORY_LIMIT:-6g}"
    # If your Linux VM has an NVIDIA GPU, uncomment below and REMOVE the
    # limits block above:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [ gpu ]

volumes:
  postgres_data:
  ollama_data:
  qdrant_data:
  hf_cache:

networks:
  meetingmind_network:
    driver: bridge
  vexa_net:
    external: true
    name: ${VEXA_NETWORK:-vexa_vexa}
