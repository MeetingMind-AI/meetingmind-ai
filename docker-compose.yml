services:
  postgres:
    image: postgres:15
    container_name: meetingmind_postgres
    shm_size: '2gb'
    oom_score_adj: -500
    environment:
      POSTGRES_DB: meetingmind
      POSTGRES_USER: meetingmind
      POSTGRES_PASSWORD: meetingmind
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - meetingmind_network

  redis:
    image: redis:7
    container_name: meetingmind_redis
    ports:
      - "6379:6379"
    networks:
      - meetingmind_network

  qdrant:
    image: qdrant/qdrant:latest
    container_name: meetingmind_qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - meetingmind_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: meetingmind_backend
    depends_on:
      - postgres
      - redis
      - qdrant
    volumes:
      - hf_cache:/home/appuser/.cache
    environment:
      DATABASE_URL: postgresql://meetingmind:meetingmind@postgres:5432/meetingmind
      REDIS_URL: redis://redis:6379/0
      VEXA_API_URL: http://host.docker.internal:8056/bots
      VEXA_WS_URL: ws://host.docker.internal:8056/ws
      VEXA_API_KEY: ${VEXA_API_KEY}
      OLLAMA_URL: http://ollama:11434/api/generate
      OLLAMA_MODEL: hermes3:8b
      OLLAMA_FINAL_MODEL: qwen3.6:14b
      OLLAMA_TIMEOUT_SECONDS: "120"
      MEM0_ENABLED: "true"
      MEM0_SEARCH_ENABLED: "true"
      MEM0_SAVE_ENABLED: "true"
      MEM0_OLLAMA_URL: http://ollama:11434
      MEM0_LLM_MODEL: hermes3:8b
      MEM0_EMBED_MODEL: nomic-embed-text
      MEM0_QDRANT_URL: http://qdrant:6333
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    networks:
      - meetingmind_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: meetingmind_frontend
    ports:
      - "3000:80"
      - "443:443"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    networks:
      - meetingmind_network

  ollama:
    image: ollama/ollama:latest
    container_name: meetingmind_ollama
    environment:
      OLLAMA_NUM_PARALLEL: "2"
      OLLAMA_KV_CACHE_TYPE: "q8_0"
      OLLAMA_MAX_VRAM: "16384"
      OLLAMA_KEEP_ALIVE: "60s"
    shm_size: '2gb'
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - meetingmind_network
    # If your Linux VM has an NVIDIA GPU, uncomment below:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  postgres_data:
  ollama_data:
  qdrant_data:
  hf_cache:

networks:
  meetingmind_network:
    driver: bridge
